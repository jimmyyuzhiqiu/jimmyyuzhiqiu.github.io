<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#FAFCFF"/><text x="120" y="145" font-size="72" font-weight="700" fill="#142A48">一堂课，持续进化</text><text x="120" y="215" font-size="32" fill="#71839B">课前 → 课中 → 课后 → 下一课</text><line x1="250" y1="585" x2="1660" y2="585" stroke="#75A8F3" stroke-width="10"/><g fill="#FFF" stroke="#3D82E8" stroke-width="9"><circle cx="260" cy="585" r="62"/><circle cx="720" cy="585" r="62"/><circle cx="1180" cy="585" r="62"/><circle cx="1640" cy="585" r="62"/></g><g font-size="44" font-weight="700" fill="#24599C" text-anchor="middle"><text x="260" y="430">课前</text><text x="720" y="430">课中</text><text x="1180" y="430">课后</text><text x="1640" y="430">下一课</text></g><g font-size="30" fill="#6C7E96" text-anchor="middle"><text x="260" y="735">备课与产出</text><text x="720" y="735">素材与互动</text><text x="1180" y="735">分析与反馈</text><text x="1640" y="735">数据回流</text></g></svg>